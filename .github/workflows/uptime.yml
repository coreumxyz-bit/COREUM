name: uptime
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check public endpoints
        run: |
          set -e
          curl -fsS --max-time 25 -o /dev/null -w "site %{http_code}\n" https://www.coreum.xyz/
          curl -fsS --max-time 25 -o /dev/null -w "state %{http_code}\n" https://www.coreum.xyz/api/state
          curl -fsS --max-time 25 -o /dev/null -w "network %{http_code}\n" https://www.coreum.xyz/api/network
          curl -fsS --max-time 25 -o /dev/null -w "stats %{http_code}\n" https://www.coreum.xyz/api/stats
          curl -fsS --max-time 30 \
            -H "content-type: application/json" \
            -H "accept: application/json, text/event-stream" \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
            -o /dev/null -w "mcp %{http_code}\n" \
            https://www.coreum.xyz/mcp
